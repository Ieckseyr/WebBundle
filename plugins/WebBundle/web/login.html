<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebBundle 登录</title>
  <link rel="stylesheet" href="app.css?v=123">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">WebBundle</div>
    <h1>登录</h1>
    <p class="muted">WebBundle 管理账号</p>
    <form id="login-form" autocomplete="off">
      <label>用户名
        <input id="username" name="username" autocomplete="username" required>
      </label>
      <label>密码
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">登录</button>
      <div id="error" class="error"></div>
    </form>
    <p class="auth-foot">没有默认账号，也没有默认密码；首次使用请先完成本机设置。</p>
  </main>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("error");
        error.textContent = "";
        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value
            })
          });
          const data = await res.json();
          if (!res.ok || data.ok === false) throw new Error(data.error ? data.error.message : "登录失败");
          location.href = "/";
        } catch (e) {
          error.textContent = e.message;
        }
      });
    })();
  </script>
</body>
</html>
